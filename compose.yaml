services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amostras}
      POSTGRES_USER: ${POSTGRES_USER:-amostras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amostras}
    ports:
      # Usa uma porta alta para não conflitar com instalações locais nas
      # portas 5432/5433. O vínculo a 127.0.0.1 não expõe o banco na rede.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
